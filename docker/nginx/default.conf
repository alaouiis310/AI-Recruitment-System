# ---------------------------------------------------------------------------
# AI Recruitment System — vhost Nginx pour l'API Laravel
# Nginx sert les fichiers statiques et délègue le PHP à php-fpm (service "app").
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name localhost;

    # Laravel expose uniquement le dossier public/ : le reste du code
    # n'est pas accessible depuis le navigateur.
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Taille max des requêtes : doit rester cohérente avec upload_max_filesize
    client_max_body_size 12M;

    # Toute URL inconnue est réécrite vers index.php (routage Laravel)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Passage des requêtes PHP au conteneur php-fpm.
    # "app" est le nom du service Docker, résolu par le DNS interne du réseau.
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # L'analyse IA peut être longue : on relève le timeout par défaut (60s)
        fastcgi_read_timeout 300;
    }

    # Blocage de l'accès aux fichiers cachés (.env, .git, ...)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
; ---------------------------------------------------------------------------
; AI Recruitment System — surcharges PHP
; Chargé après le php.ini par défaut (conf.d/99-app.ini)
; ---------------------------------------------------------------------------

; Les CV sont des PDF : la limite par défaut de 2M est insuffisante.
upload_max_filesize = 10M
post_max_size       = 12M

; L'analyse IA (extraction du CV + appel LLM) peut dépasser 30s en synchrone.
; En production elle passe par la file d'attente, mais on garde une marge.
max_execution_time  = 120
memory_limit        = 512M

; Fuseau horaire du projet
date.timezone = Africa/Casablanca

; OPcache : activé, mais sans mise en cache agressive en développement
; (sinon les modifications de code ne sont pas prises en compte).
opcache.enable                  = 1
opcache.revalidate_freq         = 0
opcache.validate_timestamps     = 1
opcache.max_accelerated_files   = 10000
opcache.memory_consumption      = 192

; Affichage complet des erreurs en développement
display_errors = On
error_reporting = E_ALL